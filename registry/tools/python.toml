[platforms.artifact]
id = "primary"
source = "asset"
url = ""
file = ""
format = "tar.gz"
size = 0
redirect_hosts = ["release-assets.githubusercontent.com"]

[platforms.artifact.selector]
name_regex = "^cpython-(?P<version>[0-9]+[.][0-9]+[.][0-9]+(?:a[1-9][0-9]*|b[1-9][0-9]*|rc[1-9][0-9]*)?)[+][0-9]{8}-x86_64-pc-windows-msvc-install_only_stripped[.]tar[.]gz$"
os = "windows"
arch = "amd64"

[platforms.artifact.checksum]
kind = "asset-field"

[platforms.install]
strip_components = 1

[[platforms.storage]]
id = "config"
kind = "config"
scope = "tool"
path = "config"
purge = "explicit"

[[platforms.storage]]
id = "cache"
kind = "content-cache"
scope = "tool"
path = "cache"
purge = "explicit"

[[platforms.storage]]
id = "history"
kind = "runtime-data"
scope = "tool"
path = "history"
purge = "explicit"

[[platforms.storage]]
id = "user-packages"
kind = "global-packages"
scope = "version"
path = "user-packages"
purge = "with-version"

[[platforms.runtime.commands]]
name = "python"
target = "{{payload}}/python.exe"
args = []
environment_profile = "default"
required = true
working_directory = "inherit"
passthrough_signals = true

[[platforms.runtime.commands]]
name = "python3"
target = "{{payload}}/python.exe"
args = []
environment_profile = "default"
required = true
working_directory = "inherit"
passthrough_signals = true

[[platforms.runtime.commands]]
name = "pip"
target = "{{payload}}/python.exe"
args = ["-m", "pip"]
environment_profile = "default"
required = true
working_directory = "inherit"
passthrough_signals = true

[[platforms.runtime.commands]]
name = "pip3"
target = "{{payload}}/python.exe"
args = ["-m", "pip"]
environment_profile = "default"
required = true
working_directory = "inherit"
passthrough_signals = true

[[platforms.runtime.environment]]
id = "default"
path_prepend = ["{{payload}}", "{{storage.user-packages}}"]
path_append = []
unset = []
override_allowed = []
shell_export = ["PIP_CONFIG_FILE", "PIP_CACHE_DIR", "PYTHONUSERBASE"]

[platforms.runtime.environment.set]
PIP_CONFIG_FILE = "{{storage.config}}/pip.ini"
PIP_CACHE_DIR = "{{storage.cache}}"
PYTHON_HISTORY = "{{storage.history}}/python_history"
PYTHONUSERBASE = "{{storage.user-packages}}"

[[platforms.validation.probes]]
id = "version"
runtime_command = "python"
args = ["--version"]
stream = "stdout"
expect = "version"
regex = "^Python (?P<version>[0-9]+[.][0-9]+[.][0-9]+(?:a[1-9][0-9]*|b[1-9][0-9]*|rc[1-9][0-9]*)?)$"
expected_version = "{{version}}"
timeout = "60s"
required = true

[[platforms.validation.probes]]
id = "pip"
runtime_command = "pip"
args = ["--version"]
stream = "stdout"
expect = "success"
timeout = "120s"
required = true

[[platforms.validation.probes]]
id = "stdlib"
runtime_command = "python"
args = ["-c", "import ssl, sqlite3, venv"]
stream = "combined"
expect = "success"
timeout = "60s"
required = true

[[platforms.validation.probes]]
id = "venv"
runtime_command = "python"
args = ["-m", "venv", "{{probe_temp}}/venv"]
stream = "combined"
expect = "success"
required_paths = ["file:{{probe_temp}}/venv/Scripts/python.exe"]
timeout = "120s"
required = true

[[platforms.validation.probes]]
id = "prefix"
runtime_command = "python"
args = ["-c", "import sys; print(sys.prefix)"]
stream = "stdout"
expect = "path-within"
regex = "^(?P<path>.+)$"
expected_root = "payload"
timeout = "60s"
required = true

