# gdtvm 日本語 message catalog（docs/04-storage-and-data.md §20）
#
# keyは§7のmessage ID grammar（`^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$`、segment
# 2件以上、1～128文字）に従うASCII dotted key。値はUTF-8 template stringで、
# placeholderは`{name}`、literal braceは`{{`/`}}`。
#
# template内へANSI escape、terminal control、秘密値展開を書かない。表示側が
# escapeしても、catalogが制御文字を持つとlog/report経由で漏れる。
#
# v0.1の言語は日本語だけだが、message ID機構はそのまま保持する。言語追加時は
# catalog fileを増やし、key/parameter集合の一致をtestで担保する。
#
# **sourceが参照しないkeyを置かない。** scripts/ci/check_messages.py が
# production GoとregistryのTOMLを走査し、網羅と未使用の両方を検査する。

