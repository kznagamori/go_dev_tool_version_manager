name: CI

# docs/11-quality-and-ci.md §5のCI matrix。v0.1の合格判定はこのworkflowだけで行う。
#
# 6 jobをubuntu-latestとwindows-latestの両方で実行し、片方のOSだけを回す分岐を作らない
# （§5.2）。paths filterも置かない。Windows固有codeを変更したPRでもLinux jobを、
# その逆も必ず実行するためである。
#
# P0-01時点ではGo sourceもbootstrap scriptも存在しない。中身が入っていないjobは
# 入力の有無を判定し、無ければ担当task IDを示して成功する。入力が入った時点で
# 自動的に実検査へ切り替わるので、placeholderが残り続けない。

on:
  pull_request:
    branches:
      - main
      - develop/work
      - claude/work
      - codex/work
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          # versionの正本は go.mod の toolchain 行だけにする。workflowへ数値を二重に
          # 書くと、片方だけ更新された状態が静かに成立するため。
          go-version-file: go.mod
      - name: toolchain一致検査
        run: |
          pinned="$(sed -n 's/^toolchain go//p' go.mod)"
          if [ -z "$pinned" ]; then
            echo "::error title=toolchain::go.mod に toolchain 行が無い。§1が要求する採用patchの固定ができていない"
            exit 1
          fi
          actual="$(go version | awk '{print $3}' | sed 's/^go//')"
          echo "go.mod toolchain=$pinned / 実行中=$actual"
          if [ "$pinned" != "$actual" ]; then
            echo "::error title=toolchain::go.mod の toolchain ($pinned) と実行中のGo ($actual) が一致しない"
            exit 1
          fi
      - name: 文書link/anchor/fence/table検査
        run: python scripts/ci/check_docs.py
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "::error title=gofmt::上のfileがgofmt済みでない"
            exit 1
          fi
          echo "gofmt済み"
      - name: go vet
        run: |
          # package 0件では go vet ./... が exit 1 になるため、対象の有無で分岐する。
          packages="$(go list ./... 2>/dev/null)"
          if [ -n "$packages" ]; then
            go vet ./...
          else
            echo "::notice title=lint: go vet 未実行::Go packageがまだ無い。P1-01 でpackage骨格が入った時点から実検査になる (docs/13-progress.md P1-01)"
          fi
      - name: vulnerability検査
        run: |
          packages="$(go list ./... 2>/dev/null)"
          if [ -n "$packages" ]; then
            go tool govulncheck ./...
          else
            echo "::notice title=lint: govulncheck 未実行::Go packageがまだ無い。P1-01 でpackage骨格が入った時点から実検査になる (docs/13-progress.md P1-01)"
          fi
      - name: 依存license検査
        run: python scripts/ci/check_licenses.py

  unit:
    name: unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: unit / contract test
        run: |
          # package 0件では go test ./... が exit 1 になるため、対象の有無で分岐する。
          packages="$(go list ./... 2>/dev/null)"
          if [ -z "$packages" ]; then
            echo "::notice title=unit: 未実行::Go packageがまだ無い。P1-01 でpackage骨格が入った時点から実検査になる (docs/13-progress.md P1-01)"
            exit 0
          fi
          # §5の「-race（対応host）」。race detectorはC toolchainを要求するため、
          # OS名ではなく実際にCCが使えるかで判定する。
          cc="$(go env CC)"
          if command -v "$cc" >/dev/null 2>&1; then
            race="-race"
            covermode="atomic"
          else
            race=""
            covermode="count"
            echo "::notice title=unit: race detector 未使用::C toolchain ($cc) が無いため -race を付けずに実行する"
          fi
          go test ./... $race -shuffle=on -covermode="$covermode" -coverprofile=coverage.out
          total="$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')"
          echo "total coverage: $total"
          echo "- unit coverage (${{ matrix.os }}): $total" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: E2E scenario
        run: |
          if [ -d test/e2e ]; then
            echo "::error title=e2e::test/e2e があるのに scenario 実行が未実装。P11-02 と P11-03 で有効化する"
            exit 1
          fi
          echo "::notice title=e2e: 未実行::E2E基盤が無いため §8 の scenario を実行していない。P11-01 の fixture 基盤の後に P11-02 と P11-03 で有効になる (docs/13-progress.md P11-01)"

  policy:
    name: policy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 禁止APIの静的検査
        run: python scripts/ci/check_policy.py
      - name: PR head/base検査
        run: python scripts/ci/check_pr_refs.py
      - name: 書込み範囲の動的検査
        run: |
          if [ -d test/e2e ]; then
            echo "::error title=policy::test/e2e があるのに §7.2 の封じ込め検査が未接続。P11-03 で有効化する"
            exit 1
          fi
          echo "::notice title=policy: 未実行::§7.2 の書込み範囲検査は e2e 実行時の記録を前提とするため未実行。P11-03 で有効になる (docs/13-progress.md P11-03)"

  package:
    name: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: archive生成と構造検査
        run: |
          if [ -f go.mod ] && [ -f VERSION ]; then
            echo "::error title=package::go.mod と VERSION があるのに archive 生成が未実装。P11-04 で有効化する"
            exit 1
          fi
          echo "::notice title=package: 未実行::go.mod と VERSION が揃っていないため 2 archive の生成と構造/permission/binary version 検査を実行していない。P11-04 で有効になる (docs/13-progress.md P11-04)"

  bootstrap:
    name: bootstrap
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: bootstrap script検査
        run: |
          scripts="$(find . -path ./.git -prune -o \( -name install.ps1 -o -name install.sh \) -print)"
          if [ -n "$scripts" ]; then
            echo "$scripts"
            echo "::error title=bootstrap::bootstrap script があるのに §12.4 の検査が未実装。P11-04 で有効化する"
            exit 1
          fi
          echo "::notice title=bootstrap: 未実行::install.ps1 と install.sh が無いため §12.4 の syntax/実行/negative 検査を実行していない。P11-04 で有効になる (docs/13-progress.md P11-04)"
